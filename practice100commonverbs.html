<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbos: escríbelo en inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#e9f0ef;--card:#fbfdfc;--tx:#12262d;--mu:#587078;--ac:#0e7c86;--acx:#fff;--ok:#18864f;--okb:#d9f3e4;--no:#c2413b;--nob:#fbe3e1;--bd:#c6d6d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--card:#15262c;--tx:#e6f1f0;--mu:#8fa9ae;--ac:#4cc9d4;--acx:#06242a;--ok:#5fd18f;--okb:#12382a;--no:#f08a84;--nob:#3b1d1c;--bd:#2a434a}}
:root[data-theme="dark"]{--bg:#0d1a1f;--card:#15262c;--tx:#e6f1f0;--mu:#8fa9ae;--ac:#4cc9d4;--acx:#06242a;--ok:#5fd18f;--okb:#12382a;--no:#f08a84;--nob:#3b1d1c;--bd:#2a434a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
#app{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:30px;line-height:1.1;margin:8px 0 6px;font-weight:800}
h2{font-size:15px;margin:22px 0 8px;font-weight:700;color:var(--mu)}
p{margin:0 0 6px;color:var(--mu)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 auto;min-width:80px;padding:12px 10px;border:2px solid var(--bd);border-radius:12px;background:var(--card);text-align:center;font-weight:700}
.chip small{display:block;font-weight:500;color:var(--mu);font-size:13px}
.chip.on{border-color:var(--ac);background:var(--ac);color:var(--acx)}
.chip.on small{color:inherit;opacity:.85}
.main{width:100%;margin-top:26px;padding:16px;border:0;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:800;font-size:18px}
.sec{width:100%;margin-top:10px;padding:14px;border:2px solid var(--ac);border-radius:14px;background:transparent;color:var(--ac);font-weight:700}
.ghost{border:0;background:none;color:var(--ac);font-weight:700;padding:6px 0}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:15px;font-weight:500}
.bar{height:8px;background:var(--bd);border-radius:8px;margin:8px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.verb{font-size:clamp(40px,13vw,66px);font-weight:800;line-height:1.05;letter-spacing:-.02em;word-break:break-word}
.meta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px;color:var(--mu);font-size:15px}
.inp{width:100%;padding:16px;font:inherit;font-size:24px;font-weight:700;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.inp.ok{border-color:var(--ok);background:var(--okb)}
.inp.no{border-color:var(--no);background:var(--nob)}
#fb{margin-top:16px;font-weight:500}
.pct{font-size:84px;font-weight:800;line-height:1;margin:14px 0 4px}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{padding:12px 0;border-bottom:1px solid var(--bd)}
.list b{font-size:19px}
.list span{display:block;color:var(--mu);font-size:15px}
.good{color:var(--ok);font-weight:700}.bad{color:var(--no);font-weight:700}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RAW=`be*|ser/estar|1
have*|tener/haber|1
do*|hacer|1
say*|decir|1
go*|ir|1
know*|saber/conocer|1
take*|tomar/llevar|1
see*|ver|1
come*|venir|1
think*|pensar|1
look|mirar|1
want|querer|1
give*|dar|1
use|usar|1
find*|encontrar|1
tell*|contar/decir|1
ask|preguntar/pedir|1
work|trabajar|1
feel*|sentir|1
try|intentar|1
call|llamar|1
need|necesitar|1
help|ayudar|1
talk|hablar|1
play|jugar/tocar|1
run*|correr|1
like|gustar|1
live|vivir|1
write*|escribir|1
read*|leer|1
open|abrir|1
walk|caminar|1
buy*|comprar|1
wait|esperar|1
love|amar|1
stay|quedarse|1
start|empezar|1
speak*|hablar|1
learn|aprender|1
die|morir|1
get*|obtener/conseguir|2
make*|fabricar/hacer|2
seem|parecer|2
leave*|salir/dejar|2
become*|convertirse|2
put*|poner|2
keep*|mantener/guardar|2
let*|permitir/dejar|2
begin*|comenzar|2
turn|girar/volverse|2
show*|mostrar|2
hear*|oír|2
move|mover|2
believe|creer|2
bring*|traer|2
happen|ocurrir|2
sit*|sentarse|2
stand*|estar de pie|2
lose*|perder|2
pay*|pagar|2
meet*|conocer/reunirse|2
change|cambiar|2
understand*|entender|2
watch|observar/ver|2
follow|seguir|2
stop|detener/parar|2
create|crear|2
allow|permitir|2
add|agregar|2
spend*|gastar|2
grow*|crecer|2
win*|ganar|2
remember|recordar|2
send*|enviar|2
sell*|vender|2
build*|construir|2
fall*|caer|2
cut*|cortar|2
pass|pasar|2
decide|decidir|2
mean*|significar|3
hold*|sostener|3
lead*|liderar/guiar|3
set*|establecer|3
provide|proveer|3
consider|considerar|3
appear|aparecer|3
serve|servir|3
expect|esperar/suponer|3
reach|alcanzar/llegar|3
kill|matar|3
remain|permanecer|3
suggest|sugerir|3
raise|levantar/aumentar|3
require|requerir|3
report|reportar/informar|3
pull|jalar/tirar|3
offer|ofrecer|3
include|incluir|3
continue|continuar|3`;
const V=RAW.trim().split("\n").map(l=>{const[a,b,c]=l.split("|");return{en:a.replace("*",""),es:b,lv:+c,irr:a.includes("*")}});
const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clash=(a,b)=>a.split("/").some(p=>b.split("/").includes(p));
const norm=s=>s.trim().toLowerCase().replace(/^to\s+/,"");
const LV=[["1","Fácil"],["2","Medio"],["3","Difícil"],["0","Todos"]];
const cnt=l=>l==="0"?V.length:V.filter(v=>v.lv==+l).length;
const pool=()=>V.filter(v=>S.lv==="0"||v.lv==+S.lv);
let S={lv:"1",n:"10"},Q=[],i=0,ok=0,wr=[],mode="main",hinted=false;

function home(){
  app.innerHTML=`<h1>Escríbelo en inglés</h1><p>Ves el verbo en español y escribes cómo se dice en inglés.</p>
  <h2>Nivel</h2><div class="row">${LV.map(([k,n])=>`<button class="chip ${S.lv===k?"on":""}" data-lv="${k}">${n}<small>${cnt(k)} verbos</small></button>`).join("")}</div>
  <h2>Preguntas por ronda</h2><div class="row">${[["10","10"],["20","20"],["all","Todas"]].map(([k,n])=>`<button class="chip ${S.n===k?"on":""}" data-n="${k}">${n}</button>`).join("")}</div>
  <p style="margin-top:18px">La pista muestra la primera letra y cuántas letras tiene. Si la usas, la respuesta no suma punto y el verbo pasa al refuerzo.</p>
  <button class="main" id="go">Empezar</button>`;
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;home()});
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.n=b.dataset.n;home()});
  $("#go").onclick=()=>begin(pool(),"main");
}

function begin(list,m){
  mode=m;let p=sh(list);
  if(m==="main"&&S.n!=="all")p=p.slice(0,+S.n);
  Q=p;i=0;ok=0;wr=[];ask();
}

function ask(){
  const q=Q[i];hinted=false;
  app.innerHTML=`<div class="top"><span>${mode==="main"?"Ronda":"Refuerzo"}: ${i+1} de ${Q.length}</span><span>Aciertos: ${ok}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="verb">${q.es}</div>
  <div class="meta"><span>Escríbelo en inglés${q.irr?" (verbo irregular)":""}</span><button class="ghost" id="hn">Pista</button></div>
  <input class="inp" id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Verbo en inglés" placeholder="Escribe aquí">
  <div class="row" style="margin-top:12px"><button class="main" id="ck" style="margin:0;width:auto;flex:2">Comprobar</button><button class="sec" id="ds" style="margin:0;width:auto;flex:1">No sé</button></div>
  <div id="fb"></div>`;
  const inp=$("#in");inp.focus();
  inp.onkeydown=e=>{if(e.key==="Enter")check(q)};
  $("#ck").onclick=()=>check(q);
  $("#ds").onclick=()=>done(q,false,"");
  $("#hn").onclick=()=>{hinted=true;$("#fb").innerHTML=`Pista: <b>${q.en[0]} ${"_ ".repeat(q.en.length-1).trim()}</b> (${q.en.length} letras). Con pista no suma punto.`;inp.focus()};
}

function check(q){
  const g=norm($("#in").value);
  if(!g){$("#in").focus();return}
  const acc=V.filter(v=>clash(v.es,q.es)).map(v=>v.en);
  done(q,acc.includes(g),g);
}

function done(q,good,g){
  const inp=$("#in");inp.disabled=true;
  ["#ck","#ds","#hn"].forEach(s=>$(s).disabled=true);
  inp.classList.add(good?"ok":"no");
  const alt=V.filter(v=>clash(v.es,q.es)&&v.en!==q.en).map(v=>v.en);
  let msg;
  if(good&&!hinted){ok++;msg=`<span class="good">Correcto.</span> ${q.es} se dice ${q.en}.`}
  else if(good){wr.push({en:q.en,es:q.es,lv:q.lv,irr:q.irr,g,hinted:true});msg=`<span class="bad">Correcto, pero con pista: no suma punto.</span> ${q.es} se dice ${q.en}.`}
  else{wr.push({en:q.en,es:q.es,lv:q.lv,irr:q.irr,g,hinted:false});msg=`<span class="bad">Incorrecto.</span> ${q.es} se dice <b>${q.en}</b>.`}
  if(alt.length)msg+=` También se acepta: ${alt.join(", ")}.`;
  const last=i+1>=Q.length;
  $("#fb").innerHTML=`${msg}<button class="main" id="nx" style="margin-top:14px">${last?"Ver resultados":"Siguiente"}</button>`;
  $("#nx").onclick=()=>{i++;last?end():ask()};
  $("#nx").focus();
}

function end(){
  const p=Math.round(ok/Q.length*100),m=mode==="main";
  const msg=p===100?"Sin errores. Excelente.":p>=80?"Muy buen resultado.":p>=50?"Vas por buen camino. Repasa los fallados.":"Hay que reforzar. Usa el refuerzo de abajo.";
  app.innerHTML=`<div class="top"><span>${m?"Resultado de la ronda":"Resultado del refuerzo"}</span></div>
  <div class="pct ${p>=70?"good":"bad"}">${p}%</div>
  <p>${ok} aciertos de ${Q.length} preguntas. ${msg}</p>
  ${wr.length?`<h2>Verbos para reforzar (${wr.length})</h2><ul class="list">${wr.map(w=>`<li><b>${w.es}</b> se dice ${w.en}<span>${w.hinted?"Acertaste con pista":w.g?"Escribiste: "+w.g:"Sin respuesta"}</span></li>`).join("")}</ul>`:`<h2>Sin errores en esta ronda</h2>`}
  ${wr.length?`<button class="main" id="rf">Reforzar los ${wr.length} verbos</button>`:""}
  <button class="${wr.length?"sec":"main"}" id="again">${m?"Otra ronda":"Volver a la ronda principal"}</button>
  <button class="sec" id="hm">Cambiar nivel</button>`;
  if(wr.length){const f=wr.slice();$("#rf").onclick=()=>begin(f,"ref")}
  $("#again").onclick=()=>begin(pool(),"main");
  $("#hm").onclick=home;
}
home();
</script>
</body>
</html>
